<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Universal File Converter - Fast, Secure & Free Client-Side Tool</title>
    <meta name="description" content="Convert PDF to JPG, JPG to PDF, and PNG to WEBP instantly in your browser. 100% private, free, secure, and offline client-side." />
    <meta name="robots" content="index, follow" />

    <!-- MONETAG CONTROLLER -->
    <script>
      function loadAds() {
        const isPremium = localStorage.getItem("premium_unlocked") === "true";
        if (isPremium) {
          console.log("Premium active: Ads blocked.");
          return;
        }

        // Load Multitag
        const multitag = document.createElement("script");
        multitag.src = "https://quge5.com/88/tag.min.js";
        multitag.dataset.zone = "236760";
        multitag.async = true;
        multitag.dataset.cfasync = "false";
        document.head.appendChild(multitag);

        // Load Onclick
        const onclickScript = document.createElement("script");
        onclickScript.text = "(function(s){s.dataset.zone='10971258',s.src='https://al5sm.com/tag.min.js'})([document.documentElement, document.body].filter(Boolean).pop().appendChild(document.createElement('script')))";
        document.head.appendChild(onclickScript);
      }

      // Run check on load
      if (document.readyState === "complete" || document.readyState === "interactive") {
        loadAds();
      } else {
        document.addEventListener("DOMContentLoaded", loadAds);
      }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
